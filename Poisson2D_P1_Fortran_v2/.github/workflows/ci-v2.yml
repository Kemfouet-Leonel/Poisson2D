name: Poisson P1 sparse validation
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scientific-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: Poisson2D_P1_Fortran_v2
    env:
      MPLBACKEND: Agg
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y gfortran make
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m pip install numpy==2.2.6 matplotlib==3.10.3
      - name: Tests unitaires en mode diagnostic
        run: make test
      - name: Compiler le solveur optimise
        run: make
      - name: Convergence trigonométrique
        run: python python/study.py --case 1 --repeat 2 --check
      - name: Convergence polynomiale
        run: python python/study.py --case 2 --repeat 2 --check
      - name: Conserver les résultats même si un contrôle échoue
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: poisson2d-v2-validation
          path: Poisson2D_P1_Fortran_v2/results/
          if-no-files-found: warn
          retention-days: 14
