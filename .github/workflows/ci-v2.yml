name: Poisson2D - Docker validation et publication

on:
  push:
    branches:
      - main
      - feature/poisson2d_v2

  pull_request:
    # Déclencher les validations pour les PR vers main.
    branches:
      - main

  # Permettre aussi un lancement manuel.
  workflow_dispatch:

# Permissions minimales par défaut.
permissions:
  contents: read

jobs:
  docker-validation:
    name: Tester et publier l'image Docker

    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      # Lire les sources du dépôt.
      contents: read

      # Autoriser la publication d'images dans GitHub Container Registry.
      packages: write

    defaults:
      run:
        shell: bash
        working-directory: Poisson2D_P1_Fortran_v2

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v5

      - name: Vérifier les fichiers nécessaires
        run: |
          test -s Dockerfile
          test -s .dockerignore
          test -s requirements.txt
          test -s Makefile
          test -s tests/unit.f90
          test -s python/plot_results.py

      - name: Définir le nom et les étiquettes de l'image
        run: |
          # Les noms d'images de registre doivent être en minuscules.
          # GITHUB_REPOSITORY contient par exemple Kemfouet-Leonel/Poisson2D.
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"

          # Conserver une étiquette liée au commit testé.
          COMMIT_TAG="sha-${GITHUB_SHA}"

          # Réserver latest à la branche principale.
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            CHANNEL="latest"
          else
            CHANNEL="dev"
          fi

          # Rendre ces variables disponibles dans les étapes suivantes.
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          echo "COMMIT_TAG=$COMMIT_TAG" >> "$GITHUB_ENV"
          echo "CHANNEL=$CHANNEL" >> "$GITHUB_ENV"

      - name: Construire et tester l'image
        run: |
          # Le Dockerfile installe les dépendances, lance make test,
          # puis compile le solveur optimisé.
          #
          # Le label associe l'image au dépôt GitHub.
          docker build \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            -t poisson2d:ci \
            .

      - name: Calculer les deux cas dans Docker
        run: |
          mkdir -p results/docker-ci

          # Les résultats sont écrits sur le runner grâce au bind mount.
          # L'utilisateur du runner devient propriétaire des fichiers produits.
          for c in 1 2; do
            docker run --rm \
              --pull=never \
              --user "$(id -u):$(id -g)" \
              --mount type=bind,source="$PWD/results/docker-ci",target=/app/results \
              poisson2d:ci \
              python python/plot_results.py \
                --case "$c" \
                --meshes 8 16 32 64 \
                --no-show
          done

      - name: Vérifier les tableaux et les figures
        run: |
          for c in 1 2; do
            for f in convergence.csv solutions_2d.png log_erreurs.png; do
              file="results/docker-ci/visualisation/case_${c}/${f}"

              if [ ! -s "$file" ]; then
                echo "::error::Fichier absent ou vide : $file"
                exit 1
              fi
            done
          done

      - name: Se connecter à GitHub Container Registry
        # Ne pas publier d'image à partir d'une pull request.
        if: github.event_name != 'pull_request'

        env:
          # Jeton temporaire automatiquement fourni par GitHub Actions.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        run: |
          # Envoyer le jeton sur l'entrée standard :
          # ne pas l'écrire dans un fichier ni l'afficher dans le journal.
          printf '%s' "$GH_TOKEN" |
            docker login ghcr.io \
              --username "$GITHUB_ACTOR" \
              --password-stdin

      - name: Publier l'image validée
        # Cette étape ne s'exécute que si les étapes précédentes ont réussi.
        if: github.event_name != 'pull_request'

        run: |
          docker tag poisson2d:ci "$IMAGE:$COMMIT_TAG"
          docker tag poisson2d:ci "$IMAGE:$CHANNEL"

          docker push "$IMAGE:$COMMIT_TAG"
          docker push "$IMAGE:$CHANNEL"

          echo "Image publiée : $IMAGE:$COMMIT_TAG"
          echo "Canal actualisé : $IMAGE:$CHANNEL"

      - name: Archiver les résultats disponibles
        # Conserver aussi les résultats partiels si un calcul échoue.
        if: always()

        uses: actions/upload-artifact@v4
        with:
          name: poisson2d-docker-results

          # Chemin depuis la racine du dépôt :
          # defaults.run ne s'applique pas aux actions uses.
          path: Poisson2D_P1_Fortran_v2/results/docker-ci/

          if-no-files-found: warn
          retention-days: 14
